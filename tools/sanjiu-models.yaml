# 三审九方模型配置 —— task-router 唯一模型源
#
# 事实源：docs/三审九方机制方案-v5-2026-08-13.md（PR #100 合入前位于
#         ws/docs/sanjiu-v5 分支；本文件按 v5 §3/§8 落地）。
# 用途：tools/task-router.py 分派/调度/抽审/评级/成本台账统一读取本文件，
#       不另设模型清单，避免配置漂移。
#
# 字段说明：
#   seat   席位键（router 内部 ID）：<审级>_<role>；role ∈ lead/antagonist/judge
#   stage  审级 1/2/3
#   role   席位角色：lead=承办/承办审计，antagonist=对抗审计，judge=裁决
#   model  首选模型标识（台账/展示用标签，如 hunyuan-hy3）
#   api_model  传给 CLI --model 的真实 API 服务 ID（如 hy3；与 HUNYUAN_MODEL/
#              GLM_MODEL/KIMI_MODEL 环境变量对齐）；缺省回退 model
#   cli    调用命令：session=当前 Codex 会话（不发起外部调用）；其余为现有桥接 CLI
#   connected  已接=true；仅留桥接接口与配置位=false（pending 标注）
#   enabled    是否在默认调度中启用（false=配置位已留，接通后改 true 即生效）
#   price  ¥/百万 token 输入/输出单价（v5 §3 口径；任务级估算见方案 §6.1）
#   alternates  备选链（按顺序降级；同厂/异厂灾备见方案 §3.2）
#
# 硬底线（router 有代码断言）：同一任务 承办与对抗审计必须异模型实例；
# 同厂同系列禁同审级；裁决与承办同厂需盲测（每月 3 例）。
#
# 已接（MECH-03 v8 定稿矩阵，2026-08-16 终裁）：hunyuan-audit（一审对抗）/
#       minimax-audit（一审裁决）/ doubao-audit（二审承办）/ deepseek-audit（二审对抗）/
#       kimi（二审裁决 kimi-k2.7-code、三审裁决 kimi-k3）/ glm-audit（三审承办）/
#       qwen-text-audit（三审对抗）——冒烟与 §3.2 盲测记录见 tools/blind-tests.md
# 待接（connected=false）：doubao-2.1-pro / minimax-m2 / qwen3.5-max /
#       kimi-k2 / glm-5.1——配置位已留，接通后按 §3.2 补盲测记录并 flip enabled。

version: 3
updated_at: "2026-08-17"

defaults:
  timeout_sec: 180            # 外部 CLI 单次调用超时
  # cost-opt B4 峰谷错峰（2026-09-01 官方核验，证据：cost-opt/docs/evidence/峰谷时段核验-20260901.md）
  peak_hours:                 # 高峰 = 周一至周五 9-12/14-18（北京时间）；空闲价 = 高峰一半
    - "Mon-Fri 09:00-12:00"
    - "Mon-Fri 14:00-18:00"
  random_rate_l2: 0.5         # §4.2 随机抽审 50%（cost-opt A1：过渡期保持原值，14 天实测回填后切 0.2）
  floor_l2: 0.7               # §4.2 总体介入 ≥70%（不足时随机补足到该下限；回填后随 random_rate_l2 同步调整）
  # cost-opt A1 抽审动态化配置位（2026-09-01 加入，冻结态：只记录不触发，14 天实测回填后启用）
  # 依据：cost-opt 需求文档 v7 R4（M3 终裁保底 20%）+ 执行方案拆解稿 v4
  audit_dynamic:
    enabled: false            # 冻结态；回填（p/一致率/拦截率基线）后置 true
    base_rate_l2: 0.2         # M3 终裁随机保底率（终裁 2026-09-01）
    f1_categories:            # 强制三审清单（AGENTS.md §二 规则③，5 项，"四类"为历史称谓）
      - external_delivery    # 对外交付
      - finance_legal        # 资金财务
      - legal_compliance     # 法律合规
      - security_vuln        # 安全漏洞
      - framework_change     # 基础框架变更
    escalate_rate: 0          # 主观提级率（冻结，14 天实测回填）
    consistency_watch:        # 防"庸俗一致"（冻结期只记录）
      warn_pct: 85
      escalate_pct: 92        # 临时上调提级率至 30% 一周
    intercept_breaker:        # 质量熔断（连续两周拦截率 >25% 回退固定 50% 抽审）
      max_intercept_pct: 25
      weeks: 2
  third_random_enabled: false # §4.3 三审随机 30% 默认关闭（高风险周/老板开关）
  third_random_rate: 0.3      # §4.3 随机抽审二审 30%
  rating_threshold: 60        # §5 评级阈值（满分 100），低于阈值计低分
  consecutive_low_hint: 3     # §5 连续 3 次低于阈值 → 提示更换模型
  third_reverse_raise: true   # §5 反向评级（低审级评三审低分）强制升人工终局


tool_seats: # 工具席位：不参与三审程序，router 分派/审计/裁决逻辑不消费（验证忽略）
  # 视觉验收流 v1（老板 2026-08-15 拍板）：L1 内部素材回读自检 / L2 对外交付素材
  # 并入所在交付物三审证据包 / L3 高影响读图双证据强制；见 AGENTS.md §10C 与机制包 07。

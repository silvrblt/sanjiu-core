# 三审九方模型配置 —— task-router 唯一模型源
#
# 事实源：docs/三审九方机制方案-v5-2026-08-13.md（PR #100 合入前位于
#         ws/docs/sanjiu-v5 分支；本文件按 v5 §3/§8 落地）。
# 用途：tools/task-router.py 分派/调度/抽审/评级/成本台账统一读取本文件，
#       不另设模型清单，避免配置漂移。
#
# 字段说明：
#   seat   席位键（router 内部 ID）：<审级>_<role>；role ∈ lead/antagonist/judge
#   stage  审级 1/2/3
#   role   席位角色：lead=承办/承办审计，antagonist=对抗审计，judge=裁决
#   model  首选模型标识（台账/展示用标签，如 hunyuan-hy3）
#   api_model  传给 CLI --model 的真实 API 服务 ID（如 hy3；与 HUNYUAN_MODEL/
#              GLM_MODEL/KIMI_MODEL 环境变量对齐）；缺省回退 model
#   cli    调用命令：session=当前 Codex 会话（不发起外部调用）；其余为现有桥接 CLI
#   connected  已接=true；仅留桥接接口与配置位=false（pending 标注）
#   enabled    是否在默认调度中启用（false=配置位已留，接通后改 true 即生效）
#   price  ¥/百万 token 输入/输出单价（v5 §3 口径；任务级估算见方案 §6.1）
#   alternates  备选链（按顺序降级；同厂/异厂灾备见方案 §3.2）
#
# 硬底线（router 有代码断言）：同一任务 承办与对抗审计必须异模型实例；
# 同厂同系列禁同审级；裁决与承办同厂需盲测（每月 3 例）。
#
# 已接（MECH-03 v8 定稿矩阵，2026-08-16 终裁）：hunyuan-audit（一审对抗）/
#       minimax-audit（一审裁决）/ doubao-audit（二审承办）/ deepseek-audit（二审对抗）/
#       kimi（二审裁决 kimi-k2.7-code、三审裁决 kimi-k3）/ glm-audit（三审承办）/
#       qwen-text-audit（三审对抗）——冒烟与 §3.2 盲测记录见 tools/blind-tests.md
# 待接（connected=false）：doubao-2.1-pro / minimax-m2 / qwen3.5-max /
#       kimi-k2 / glm-5.1——配置位已留，接通后按 §3.2 补盲测记录并 flip enabled。

